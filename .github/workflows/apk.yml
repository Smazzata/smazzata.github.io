name: App Android (APK)

on:
  push:
    branches: [main]
    # il gioco online arriva sempre aggiornato dal server: l'app si ricompila solo se cambia il guscio o la pagina
    # d'ingresso (che sono dentro l'app). La copia per giocare senza internet si rinnova a ogni nuova versione;
    # per rinnovarla apposta: Actions → «App Android (APK)» → Run workflow.
    paths: ['android-app/**', 'launcher/**', 'scripts/build-pages.js', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Capacitor 8 (Android 16, API 36: obbligatorio per il Play Store) vuole Node 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # i file del gioco dentro l'app: pagina d'ingresso + copia del gioco in gioca/ (motore e computer per l'offline)
      - name: File del gioco (www)
        run: |
          node scripts/build-pages.js android-app/www
          test -f android-app/www/index.html && test -f android-app/www/gioca/engine.js
          # niente "server.url": l'app apre i file che ha dentro, non un sito
          ! grep -q '"url"' android-app/capacitor.config.json

      - name: Progetto Android con Capacitor
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          # numero di versione nel "nome" dell'app (BurracoApp/N): il gioco lo confronta con l'ultima Release
          sed -i 's/"appendUserAgent": "BurracoApp /"appendUserAgent": "BurracoApp\/${{ github.run_number }} /' capacitor.config.json
          grep 'BurracoApp/${{ github.run_number }} SmazzataLocale' capacitor.config.json
          npx cap add android
          # il Play Store accetta solo app per Android 16 (API 36) o più recenti
          grep -E 'targetSdkVersion = (3[6-9]|[4-9][0-9])' android/variables.gradle
          # microfono per i messaggi vocali al tavolo, vibrazione per il feedback tattile
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' android/app/src/main/AndroidManifest.xml
          grep RECORD_AUDIO android/app/src/main/AndroidManifest.xml
          grep VIBRATE android/app/src/main/AndroidManifest.xml
          # icone dell'app (sostituiscono quelle predefinite di Capacitor)
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r icons/* android/app/src/main/res/
          # numero di versione crescente, così Android accetta gli aggiornamenti
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compila e firma l'APK
        working-directory: android-app
        run: |
          # apksigner sta tra i build-tools dell'SDK Android, non nel PATH
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          which apksigner
          npx cap build android --androidreleasetype APK --signing-type apksigner \
            --keystorepath "$PWD/burraco.p12" --keystorepass burraco-amici \
            --keystorealias burraco --keystorealiaspass burraco-amici
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | grep -v unsigned | head -1)
          [ -n "$apk" ] || apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $apk"
          cp "$apk" Burraco.apk
          ls -la Burraco.apk

      - name: Pacchetto per il Play Store (AAB)
        working-directory: android-app
        env:
          # chiave di caricamento del Play Store: segreta, nei Secrets di GitHub (diversa da burraco.p12, che è pubblica)
          PLAY_UPLOAD_KEY: ${{ secrets.PLAY_UPLOAD_KEY }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$PLAY_UPLOAD_KEY" ] || [ -z "$PLAY_UPLOAD_KEY_PASSWORD" ]; then
            echo "::warning::Manca la chiave di caricamento (Secrets PLAY_UPLOAD_KEY e PLAY_UPLOAD_KEY_PASSWORD): niente Smazzata.aab questa volta"
            exit 0
          fi
          echo "$PLAY_UPLOAD_KEY" | base64 -d > "$RUNNER_TEMP/caricamento-play.p12"
          # Google Play vuole il "bundle" (.aab), firmato con la chiave di caricamento
          # la versione dello Store si aggiorna dallo Store: con "SmazzataStore" il gioco non propone di scaricare l'APK
          sed -i 's/SmazzataLocale"/SmazzataLocale SmazzataStore"/' capacitor.config.json
          npx cap copy android
          grep SmazzataStore android/app/src/main/assets/capacitor.config.json
          npx cap build android --androidreleasetype AAB --signing-type jarsigner             --keystorepath "$RUNNER_TEMP/caricamento-play.p12" --keystorepass "$PLAY_UPLOAD_KEY_PASSWORD"             --keystorealias caricamento --keystorealiaspass "$PLAY_UPLOAD_KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/caricamento-play.p12"
          aab=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "AAB: $aab"
          cp "$aab" Smazzata.aab
          ls -la Smazzata.aab

      - name: Pubblica nelle Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Smazzata per Android (versione 1.${{ github.run_number }})
          make_latest: true
          files: |
            android-app/Burraco.apk
            android-app/Smazzata.aab
          body: |
            Scarica **Burraco.apk** qui sotto e aprilo dal telefono Android (il file ha ancora il vecchio nome, così gli aggiornamenti continuano a funzionare).
            **Smazzata.aab** serve solo per caricare l'app sul Play Store.
            Se Android lo chiede, consenti l'installazione di app da questa fonte (browser o file).
            Il gioco è dentro l'app: senza internet si gioca contro il computer; da collegati l'app trova il server da sola.
