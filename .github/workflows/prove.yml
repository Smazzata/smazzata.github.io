name: Prove

# A ogni modifica: test del motore, prova multigiocatore e prova dell'interfaccia in un vero browser.
# Il telefono-server si aggiorna solo se queste prove sono passate (vedi scripts/android-server.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  prove:
    name: Prove
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test del motore (partite simulate, Scala 40, archivio, campionati, trofei)
        # di rado una partita simulata con regole casuali si blocca: dopo 12 minuti si ferma e si riprova una volta
        run: timeout 720 npm test || { echo "::warning::Test del motore bloccato o fallito: lo ripeto una volta"; timeout 720 npm test; }
      - name: Prova multigiocatore end-to-end
        run: npm run e2e
      - name: Prova dell'interfaccia nel browser (Chrome senza finestra)
        run: npm run ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Schermate della prova dell'interfaccia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermate
          path: test-output/
          if-no-files-found: ignore
