name: Prove

# A ogni modifica: test del motore, prova multigiocatore e prova dell'interfaccia in un vero browser.
# Il telefono-server si aggiorna solo se queste prove sono passate (vedi scripts/android-server.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  prove:
    name: Prove
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Privacy e cancellazione nel browser
        run: node server/privacy-uitest.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Test del motore (partite simulate, Scala 40, archivio, campionati, trofei)
        # di rado una partita simulata con regole casuali si blocca: dopo 12 minuti si ferma e si riprova una volta
        run: |
          timeout 720 npm test || { echo "::warning::Test del motore bloccato o fallito, lo ripeto una volta"; timeout 720 npm test; }
      - name: Prova multigiocatore end-to-end
        run: npm run e2e
      - name: Riconnessione, progressi reali e collezione avatar
        run: npm run test:prerilascio
      - name: Uso quotidiano con molti profili e due dispositivi
        run: node server/daily-use-test.js 120 7 && node server/signup-burst-test.js 12
      - name: Scenari riproducibili di stress e probabilità delle chest
        run: npm run test:stress && npm run test:partite -- 40
      - name: Ranked (Glicko-2, BO3, Solo/Duo, persistenza e simulazioni)
        run: npm run test:ranked && npm run e2e:ranked && npm run sim:ranked
      - name: Campagna (150 livelli, obiettivi, vite e ricompense)
        run: npm run test:campagna
      - name: Prova delle animazioni delle carte (tutti i giochi, con il ritardo del server)
        run: npm run anim
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Menu e home su schermi piccoli
        run: node server/chest-uitest.js --menus
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Lente, tavolo e anteprime
        run: node server/chest-uitest.js --comfort
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Rifiniture e comodità su telefono
        run: node server/chest-uitest.js --qol
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Fine partita, inviti e premi
        run: node server/chest-uitest.js --rewards
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Cicli quotidiani nel browser
        run: node server/chest-uitest.js --daily
        env:
          CHROME_PATH: /usr/bin/google-chrome
          DAILY_UI_CYCLES: 20
      - name: Inventario semplificato
        run: node server/chest-uitest.js --simple
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Percorso e ricordi
        run: node server/chest-uitest.js --journey
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Primo uso dell’inventario
        run: node server/chest-uitest.js --first-use
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Inventario completo e apertura chest
        run: node server/chest-uitest.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Rifiniture grafiche
        run: node server/uitest.js --polish
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Partite e navigazione completa nel browser
        run: npm run ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Interfaccia della campagna
        run: node server/uitest.js --campaign
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Schermate della prova dell'interfaccia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermate
          path: test-output/
          if-no-files-found: ignore
