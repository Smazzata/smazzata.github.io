name: Pagina d'ingresso e gioco senza internet (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'public/**'
      - 'shared/**'
      - 'server/engine.js'
      - 'server/bot.js'
      - 'scripts/build-pages.js'
      - 'scripts/bundle-engine.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # pagina d'ingresso + copia del gioco in gioca/ (con motore e computer per giocare offline)
      - run: node scripts/build-pages.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
