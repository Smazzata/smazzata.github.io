name: Pubblica su Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Space di destinazione nel formato "utente-huggingface/nome-space"
  HF_SPACE: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push nello Space
        if: env.HF_SPACE != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
