<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f5132">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Smazzata</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="intro.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- intro animata all'apertura: resta finché il gioco è pronto (vedi hideIntro in js/connessione.js) -->
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-fan">
      <div class="ic" style="--i:0"><b>A</b><i>♠</i><em>♠</em></div>
      <div class="ic red" style="--i:1"><b>K</b><i>♥</i><em>♥</em></div>
      <div class="ic joker" style="--i:2"><b>★</b><em>★</em></div>
      <div class="ic red" style="--i:3"><b>Q</b><i>♦</i><em>♦</em></div>
      <div class="ic" style="--i:4"><b>J</b><i>♣</i><em>♣</em></div>
    </div>
    <h1 class="intro-title">Smazzata</h1>
    <p class="intro-sub">Burraco · Scala 40 · Canasta · Scopa · Briscola</p>
    <div class="intro-load"><span>♠</span><span>♥</span><span>♣</span><span>♦</span></div>
    <p class="intro-msg" id="introMsg">Mescolo le carte…</p>
  </div>
  <div id="app"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" aria-label="Chiudi">✕</button>
      <div class="modal-content"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <!-- percorsi relativi: la stessa pagina funziona sul server e, senza internet, dalla pagina fissa -->
  <script src="socket.io/socket.io.js"></script>
  <script src="shared/rules.js"></script>
  <script src="shared/melds.js"></script>
  <script src="shared/scala40.js"></script>
  <script src="shared/canasta.js"></script>
  <script src="shared/scopa.js"></script>
  <script src="shared/briscola.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="local-server.js"></script>
  <script src="js/lingue.js"></script>
  <script src="js/base.js"></script>
  <script src="js/connessione.js"></script>
  <script src="js/voce.js"></script>
  <script src="js/carte.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/profilo.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/schermate.js"></script>
  <script src="js/tavolo.js"></script>
  <script src="js/animazioni.js"></script>
  <script src="js/finestre.js"></script>
  <script src="js/moviola.js"></script>
  <script src="js/azioni.js"></script>
  <script src="js/comandi.js"></script>
</body>
</html>
